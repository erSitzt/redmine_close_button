name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match VERSION file ($version)"
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGES.md
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="### $version" '
            $0 == v { found = 1; next }
            found && /^### / { exit }
            found { print }
          ' CHANGES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section '### $version' found in CHANGES.md"
            exit 1
          fi
          cat release-notes.md

      - name: Build plugin archive
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p build/redmine_close_button
          git archive HEAD | tar -x -C build/redmine_close_button
          rm -rf build/redmine_close_button/.github
          (cd build && zip -r "../redmine_close_button-${version}.zip" redmine_close_button)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            --title "$version" \
            --notes-file release-notes.md \
            "redmine_close_button-${version}.zip"
